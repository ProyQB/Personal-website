<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Prince Trantham</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Prince Trantham</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container page-content">
        <h1>Get in Touch</h1>
        <p class="subtitle">Have a project in mind or want to collaborate? Drop a message below.</p>

        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Your email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Your message"></textarea>
            </div>
            <button type="submit" class="btn primary">Send Message</button>
            <p id="formFeedback" class="feedback-msg"></p>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Prince Trantham. All rights reserved.</p>
        </div>
    </footer>

    <script src="javascript.js"></script>
</body>
</html>
